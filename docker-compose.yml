services:
  # MySQL - Hive元数据存储
  mysql:
    image: mysql:5.7
    container_name: hive-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hive_metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hadoop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Hadoop Namenode
  namenode:
    image: apache/hadoop:3
    container_name: namenode
    hostname: namenode
    user: root
    command: bash -c "mkdir -p /hadoop/dfs/name && if [ ! -d /hadoop/dfs/name/current ]; then hdfs namenode -format -force; fi && hdfs namenode"
    environment:
      HADOOP_HOME: /opt/hadoop
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - hadoop-network

  # Hadoop Datanode
  datanode:
    image: apache/hadoop:3
    container_name: datanode
    hostname: datanode
    user: root
    command: bash -c "mkdir -p /hadoop/dfs/data && sleep 15 && hdfs datanode"
    environment:
      HADOOP_HOME: /opt/hadoop
    env_file:
      - ./hadoop.env
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - hadoop-network
    depends_on:
      - namenode

  # Hive Metastore
  hive-metastore:
    build: ./hive
    container_name: hive-metastore
    hostname: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver -Djavax.jdo.option.ConnectionURL=jdbc:mysql://hive-mysql:3306/hive_metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive123"
    ports:
      - "9083:9083"
    networks:
      - hadoop-network
    depends_on:
      mysql:
        condition: service_healthy
      namenode:
        condition: service_started
      datanode:
        condition: service_started

  # HiveServer2
  hive:
    build: ./hive
    container_name: hive-server
    hostname: hive-server
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: mysql
      IS_RESUME: "true"
      SERVICE_OPTS: "-Djavax.jdo.option.ConnectionDriverName=com.mysql.cj.jdbc.Driver -Djavax.jdo.option.ConnectionURL=jdbc:mysql://hive-mysql:3306/hive_metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true -Djavax.jdo.option.ConnectionUserName=hive -Djavax.jdo.option.ConnectionPassword=hive123 -Dhive.metastore.uris=thrift://hive-metastore:9083"
      HIVE_SERVER2_THRIFT_PORT: 10000
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - hadoop-network
    depends_on:
      - hive-metastore

  # Spark Master
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - hadoop-network

  # Spark Worker
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - hadoop-network
    depends_on:
      - spark-master

volumes:
  mysql_data:
  namenode_data:
  datanode_data:

networks:
  hadoop-network:
    driver: bridge
